{% extends "auctions/layout.html" %}

{% block body %}
    <h2>My Watchlist</h2>

    {% for listing in listings %}
        <div class="listing-item">
            <h3><a href="{% url 'listing_detail' listing.id %}">{{ listing.title }}</a></h3>
            <p>Price: ${{ listing.price }}</p>
        </div>
    {% empty %}
        <p>Your watchlist is empty.</p>
    {% endfor %}
{% endblock %}
