{% extends "auctions/layout.html" %}

{% block body %}
    <a href="{% url 'new' %}">+ Add listing</a>

    <h2>Active Listings</h2>

    {% for listing in listings %}

        <h3><a href="{% url 'listing_detail' listing.id %}">{{ listing.title }}</a></h3>

        <p></p><b>Price: </b>${{ listing.price }} MXN</p>

        <p></p><b>Category: </b>{{ listing.get_category_display }}</p>

        <hr>

    {% empty %}

        <h3>No listings</h3>

    {% endfor %}

{% endblock %}
