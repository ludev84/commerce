{% extends "auctions/layout.html" %}

{% block body %}

    <h2>{{ listing.title }}</h2>

    <h3>Price</h3>
    <p>${{ listing.price }} MXN</p>

    <h3>Category</h3>
    <p>{{ listing.get_category_display }}</p>

    {% if user.is_authenticated %}

        <a href="{% url 'add_watchlist' listing.id %}">Add/Remove Watchlist</a>

    {% endif %}

{% endblock %}
