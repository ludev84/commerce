{% extends "auctions/layout.html" %}

{% block body %}

    <h2>Listings from {{ category }}</h2>
    
    <br>

    {% for listing in listings %}

        <h3><a href="{% url 'listing_detail' listing.id %}">{{ listing.title }}</a></h3>

        <hr>

    {% empty %}

        <p>No Listings in this category</p>

    {% endfor %}

{% endblock %}
